name: CI

# Per-commit job, scoped to what exists after Step 0: no retrieval, no database wiring, and
# therefore no integration job yet -- see devops-pipeline.md#1-the-per-commit-job. Step 1 adds
# the Postgres + Flyway + backend services this job will need once repositories/ is real.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install (frozen lockfile)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src

      - name: Layering (lint-imports)
        run: uv run lint-imports

      # The REST-only rule, greppable -- devops-pipeline.md#the-rest-only-rule-is-greppable.
      # A hit means SQL is reaching a business table.
      - name: REST-only rule
        run: |
          ! grep -rE '\b(reservations|properties|room_types|rooms|users|sessions|payments)\b' \
            src/hotelapp_ai/repositories/

      # Markdown under corpus/ is the reviewable source; corpus/pdf/ and corpus/figures/ are
      # gitignored build artifacts (corpus/README.md). Step 1's ingestion tests assert against
      # the real rendered PDFs -- per architecture-specification.md, "test against real rendered
      # PDFs, not synthetic strings" -- so CI has to produce them first, the same way a developer
      # does locally before running pytest. A DejaVu TTF is installed so the renderer takes its
      # real-font path rather than its ASCII-transliteration fallback, matching local output.
      - name: Install fonts for corpus rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Render corpus (figures + PDFs)
        run: |
          uv run python scripts/make_figures.py
          uv run python scripts/render_corpus.py

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Image build
        run: docker build -t hotelapp-ai-service:ci .
