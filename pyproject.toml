[project]
name = "hotelapp-ai"
version = "0.1.0"
description = "AI service for HotelApp -- MCP server, retrieval-augmented guest assistant, natural-language availability search. Reads business data over REST, never SQL."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.28",
    "structlog>=24.4,<25",
    "psycopg[binary,pool]>=3.2,<3.3",
    "pgvector>=0.3,<0.4",
    "pypdf>=5.1,<6",
    "sentence-transformers>=3.2,<4",
    "torch>=2.2,<3",
    "langgraph>=1.2,<1.3",
    "fastmcp>=2.0,<3",
]

[project.scripts]
hotelapp-ai = "hotelapp_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "testcontainers[postgres]>=4.8,<5",
    "fpdf2>=2.8.9",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotelapp_ai"]

# `sentence-transformers` pulls in `torch` as the reranker's one local model
# (dependency-policy.md). The default PyPI wheel bundles a full CUDA stack --
# several GB of nvidia-* packages this CPU-only reranker never uses, and enough to
# exhaust a CI runner's disk building the Docker image. Pinning torch to the
# official CPU-only index keeps the image to what "keeps reranking free and
# offline" actually requires.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
src = ["src"]
# scripts/ pre-dates this step (corpus PDF/figure rendering) and is out of scope for Step 0.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "hotelapp_ai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "transport knows HTTP/MCP, not models, prompts, or SQL"
type = "forbidden"
source_modules = ["hotelapp_ai.transport"]
forbidden_modules = ["langchain", "openai", "psycopg", "httpx"]
# `gateways/hotelapp.py` legitimately owns an `httpx.AsyncClient` (module-registry.md's
# `gateways/` import table) and `transport/mcp/tools.py`/`stdio.py` legitimately call it directly
# (AI Step 5: MCP tools are "thin wrappers over gateways/hotelapp.py", unlike `transport/rest/`,
# which reaches services only through an untyped `request.app.state` handle specifically to avoid
# this). This contract's own name says transport is allowed to know HTTP -- the one edge ignored
# here is exactly that, and nothing else: `services/llm_client.py`'s own `httpx` import (the
# model-calling one) is not covered by this ignore, and the contract still catches transport
# reaching it, which is what "not models" is actually policing.
ignore_imports = ["hotelapp_ai.gateways.hotelapp -> httpx"]

[[tool.importlinter.contracts]]
name = "services never import the transport frameworks"
type = "forbidden"
source_modules = ["hotelapp_ai.services"]
forbidden_modules = ["fastapi", "fastmcp", "authlib"]

[[tool.importlinter.contracts]]
name = "gateways and repositories never import each other"
type = "independence"
modules = ["hotelapp_ai.gateways", "hotelapp_ai.repositories"]

[[tool.importlinter.contracts]]
name = "domain is pure -- stdlib only"
type = "forbidden"
source_modules = ["hotelapp_ai.domain"]
forbidden_modules = [
    "hotelapp_ai.transport",
    "hotelapp_ai.services",
    "hotelapp_ai.gateways",
    "hotelapp_ai.repositories",
    "hotelapp_ai.config",
]
